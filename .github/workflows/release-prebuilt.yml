name: Release pushed prebuilt application

on:
  push:
    branches:
      - main
    paths:
      - "prebuilt/windows-x64/**"
      - ".github/workflows/release-prebuilt.yml"

permissions:
  contents: write

concurrency:
  group: prebuilt-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package pushed files and create release
    runs-on: windows-latest

    steps:
      - name: Checkout the pushed files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the pushed prebuilt files
        shell: pwsh
        run: |
          $exe = Test-Path -LiteralPath 'prebuilt/windows-x64/ExcelTrainingMonitor.exe'
          $zip = Test-Path -LiteralPath 'prebuilt/windows-x64/ExcelTrainingMonitor.zip'
          if (-not ($exe -or $zip)) {
            throw 'Neither prebuilt/windows-x64/ExcelTrainingMonitor.exe nor prebuilt/windows-x64/ExcelTrainingMonitor.zip was included in this push.'
          }

      - name: Calculate the next GitHub release version
        id: version
        shell: pwsh
        run: |
          $releasedCommit = @(git tag --points-at HEAD --list 'v*.*.*' | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect release tags for this commit.' }
          if ($releasedCommit.Count -gt 0) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host "Commit already released as $($releasedCommit[0])."
            exit 0
          }

          $tags = @(git tag --list 'v*.*.*')
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read existing release tags.' }

          $versions = foreach ($tag in $tags) {
            if ($tag -match '^v?(\d+)\.(\d+)\.(\d+)$') {
              [version]::new([int]$Matches[1], [int]$Matches[2], [int]$Matches[3])
            }
          }

          $latest = @($versions | Sort-Object -Descending | Select-Object -First 1)
          if ($latest.Count -eq 0) {
            $next = [version]'1.0.0'
          } else {
            $current = $latest[0]
            $next = [version]::new($current.Major, $current.Minor, $current.Build + 1)
          }

          "skip=false" >> $env:GITHUB_OUTPUT
          "number=$next" >> $env:GITHUB_OUTPUT
          "tag=v$next" >> $env:GITHUB_OUTPUT
          Write-Host "Next GitHub release: v$next"

      - name: Package the pushed prebuilt files
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.number }}'
          $source = 'prebuilt/windows-x64'
          $output = 'release-assets'
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $exePath = Join-Path $source 'ExcelTrainingMonitor.exe'
          $zipPath = Join-Path $source 'ExcelTrainingMonitor.zip'

          # prefer an already-provided zip, otherwise package the exe
          if (Test-Path $zipPath) {
            $zipAsset = Join-Path $output "ExcelTrainingMonitor-$version-win-x64.zip"
            Copy-Item -LiteralPath $zipPath -Destination $zipAsset -Force
            $exeAsset = $null
          } else {
            if (-not (Test-Path $exePath)) { throw 'Expected executable missing during packaging step.' }
            $exeAsset = Join-Path $output "ExcelTrainingMonitor-$version-win-x64.exe"
            Copy-Item -LiteralPath $exePath -Destination $exeAsset -Force
            $zipAsset = Join-Path $output "ExcelTrainingMonitor-$version-win-x64.zip"
            Compress-Archive -Path "$source/*" -DestinationPath $zipAsset -Force
          }

          $hashFiles = @()
          if ($exeAsset) { $hashFiles += $exeAsset }
          if ($zipAsset) { $hashFiles += $zipAsset }

          if ($hashFiles.Count -gt 0) {
            Get-FileHash -LiteralPath $hashFiles -Algorithm SHA256 |
              ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } |
              Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.txt')
          }

      - name: Create GitHub Release from the pushed files
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem 'release-assets' -File | Select-Object -ExpandProperty FullName
          gh release create '${{ steps.version.outputs.tag }}' @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ExcelTrainingMonitor ${{ steps.version.outputs.number }}" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
